<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <title>Search - CamBiz Market</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container py-4">
            <h2>🔍 Search Results</h2>
            
            <form th:action="@{/search}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text" name="keyword" class="form-control" th:value="${criteria.keyword}" placeholder="Search products...">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>
            
            <p th:if="${results != null}">Found <strong th:text="${results.totalResults}">0</strong> results</p>
            
            <div class="row">
                <div th:each="product : ${results.products}" class="col-md-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                <a th:href="@{/product-detail/{id}(id=${product.id})}" th:text="${product.name}">Product Name</a>
                            </h5>
                            <p class="text-muted small" th:text="${#strings.abbreviate(product.description, 80)}"></p>
                            <h6 th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, ' FCFA')}"></h6>
                            <span th:if="${product.inStock}" class="badge bg-success">In Stock</span>
                            <span th:unless="${product.inStock}" class="badge bg-danger">Out of Stock</span>
                            <span th:if="${product.freeDelivery}" class="badge bg-info">Free Delivery</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(results.products)}" class="text-center py-5">
                <h4>No products found</h4>
                <p>Try different keywords or <a th:href="@{/store}">browse the store</a></p>
            </div>
        </div>
    </div>
</body>
</html>
