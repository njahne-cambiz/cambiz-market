<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search - CamBiz Market</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h2>🔍 Search Results</h2>
        
        <form th:action="@{/search}" method="get" class="mb-4">
            <div class="input-group">
                <input type="text" name="keyword" class="form-control" th:value="${criteria.keyword}" placeholder="Search products...">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>
        
        <p th:if="${results != null}">
            Found <strong th:text="${results.totalResults}">0</strong> results
        </p>
        
        <div class="row">
            <div th:each="product : ${results.products}" class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                        <p class="card-text text-muted" th:text="${product.description}">Description</p>
                        <p class="card-text">
                            <strong th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, ' FCFA')}">0 FCFA</strong>
                        </p>
                        <span th:if="${product.inStock}" class="badge bg-success">In Stock</span>
                        <span th:unless="${product.inStock}" class="badge bg-danger">Out of Stock</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${results == null || #lists.isEmpty(results.products)}" class="text-center py-5">
            <h4>No products found</h4>
            <p>Try different keywords</p>
        </div>
    </div>
</body>
</html>
